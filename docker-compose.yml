version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant_os_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://merchant:SecurePass123!@postgres:5432/merchant_os_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=production_super_secret_jwt_key_991020
      - NEXTAUTH_URL=https://merchantos.bd
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: merchant_os_postgres
    restart: always
    environment:
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: merchant_os_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: merchant_os_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: merchant_os_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
