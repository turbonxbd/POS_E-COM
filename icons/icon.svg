<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1c2e"/>
      <stop offset="100%" style="stop-color:#070b12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow circle -->
  <circle cx="256" cy="256" r="160" fill="rgba(16,185,129,0.07)"/>
  <!-- Barcode bars -->
  <rect x="130" y="160" width="16" height="192" rx="4" fill="url(#glow)"/>
  <rect x="158" y="160" width="8" height="192" rx="3" fill="url(#glow)" opacity="0.8"/>
  <rect x="178" y="160" width="24" height="192" rx="4" fill="url(#glow)"/>
  <rect x="214" y="160" width="12" height="192" rx="3" fill="url(#glow)" opacity="0.9"/>
  <rect x="238" y="160" width="20" height="192" rx="4" fill="url(#glow)"/>
  <rect x="270" y="160" width="8" height="192" rx="3" fill="url(#glow)" opacity="0.8"/>
  <rect x="290" y="160" width="28" height="192" rx="4" fill="url(#glow)"/>
  <rect x="330" y="160" width="12" height="192" rx="3" fill="url(#glow)" opacity="0.9"/>
  <rect x="354" y="160" width="16" height="192" rx="4" fill="url(#glow)"/>
  <!-- Scan line -->
  <rect x="120" y="248" width="272" height="4" rx="2" fill="#10b981" opacity="0.5"/>
  <!-- Bottom text label area -->
  <rect x="160" y="372" width="192" height="36" rx="8" fill="rgba(16,185,129,0.15)"/>
  <text x="256" y="396" font-family="monospace" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">Smart POS BD</text>
</svg>
